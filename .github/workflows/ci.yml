name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Allow manual runs from the Actions tab (useful for testing CI changes).
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: "Lint (Ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements-dev.txt

      # Dev requirements pin the ruff version — one source of truth.
      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt

      - name: Lint
        run: ruff check api/ poller/ --output-format=github

      - name: Format check
        run: ruff format api/ poller/ --check


  test:
    name: "Test (Pytest)"
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netwatch
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: netwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netwatch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: netwatch
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: netwatch_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      ENVIRONMENT: testing

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt

      # Prove the migration chain runs clean against real PostgreSQL,
      # then prove it is reversible, then land on head for good.
      - name: Run database migrations (up, down, up)
        working-directory: api
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        working-directory: api
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      # Parser tests are pure stdlib — no netmiko install needed.
      - name: Run poller unit tests
        working-directory: poller
        run: pytest tests/ -v --tb=short

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: api/test-results.xml


  build:
    name: "Build Docker Image"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          # Images tagged with the commit SHA are traceable to their exact source.
          tags: netwatch-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
