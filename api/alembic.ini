# Alembic configuration for the NetWatch API.
#
# The database URL is deliberately NOT set here — env.py builds it from the
# application's Settings class (app/config.py), so there is exactly one place
# database credentials come from: environment variables.

[alembic]
# Where migration scripts live, relative to this file.
script_location = %(here)s/alembic

# Make `alembic` runnable from api/ — puts the current directory on sys.path
# so env.py can import the app package.
prepend_sys_path = .

path_separator = os

# Readable migration filenames: 0001_initial_schema.py
file_template = %%(rev)s_%%(slug)s


# Logging configuration (consumed by env.py's fileConfig call).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
