# No sqlalchemy.url here — env.py builds it from the app's Settings (env vars).

[alembic]
script_location = %(here)s/alembic

# Puts api/ on sys.path so env.py can import the app package.
prepend_sys_path = .

path_separator = os

# Filenames like 0001_initial_schema.py
file_template = %%(rev)s_%%(slug)s


# Logging configuration (consumed by env.py's fileConfig call).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
