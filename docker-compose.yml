services:

  db:
    image: postgres:16-alpine
    container_name: netwatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - netwatch-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: netwatch-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # Dev override of the image CMD: apply migrations, then start uvicorn with
    # --reload. In production, `alembic upgrade head` runs as a separate deploy
    # step (K8s init container / release job) — never inside the app process.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      # Bind mounts for hot-reload during development.
      # Remove for production — code should be baked into the image.
      - ./api/app:/app/app
      - ./api/alembic:/app/alembic
      - ./api/alembic.ini:/app/alembic.ini
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - netwatch-net

  poller:
    build:
      context: ./poller
      dockerfile: Dockerfile
    container_name: netwatch-poller
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - netwatch-net

networks:
  netwatch-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
