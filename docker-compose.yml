services:

  db:
    image: postgres:16-alpine
    container_name: netauto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - netauto-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: netauto-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        apt-get update -qq &&
        apt-get install -y -qq netcat-openbsd &&
        chmod +x /app/scripts/wait-for-db.sh &&
        /app/scripts/wait-for-db.sh db 5432 --
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    volumes:
      - ./api/app:/app/app
      - ./scripts:/app/scripts
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - netauto-net

  poller:
    build:
      context: ./poller
      dockerfile: Dockerfile
    container_name: netauto-poller
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - netauto-net

networks:
  netauto-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
