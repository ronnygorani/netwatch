services:

  db:
    image: postgres:16-alpine
    container_name: netwatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - netwatch-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: netwatch-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # Dev-only: migrate then reload-serve. In prod, migrations run as a deploy step.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      # Dev bind mounts for hot-reload; prod runs code baked into the image.
      - ./api/app:/app/app
      - ./api/alembic:/app/alembic
      - ./api/alembic.ini:/app/alembic.ini
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - netwatch-net

  poller:
    build:
      context: ./poller
      dockerfile: Dockerfile
    container_name: netwatch-poller
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      POLLER_MAX_WORKERS: ${POLLER_MAX_WORKERS:-10}
      # Mint with: docker compose exec api python -m app.create_api_key poller "metrics:write"
      NETWATCH_API_KEY: ${NETWATCH_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - netwatch-net

  # Source of truth (Phase 5): Nautobot with its own database and Redis.
  nautobot-db:
    image: postgres:16-alpine
    container_name: netwatch-nautobot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nautobot
      POSTGRES_PASSWORD: ${NAUTOBOT_DB_PASSWORD}
      POSTGRES_DB: nautobot
    volumes:
      - nautobot_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nautobot -d nautobot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - netwatch-net

  redis:
    image: redis:7-alpine
    container_name: netwatch-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netwatch-net

  nautobot:
    image: networktocode/nautobot:2.4-py3.12
    container_name: netwatch-nautobot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NAUTOBOT_DB_HOST: nautobot-db
      NAUTOBOT_DB_USER: nautobot
      NAUTOBOT_DB_PASSWORD: ${NAUTOBOT_DB_PASSWORD}
      NAUTOBOT_DB_NAME: nautobot
      NAUTOBOT_REDIS_HOST: redis
      NAUTOBOT_SECRET_KEY: ${NAUTOBOT_SECRET_KEY}
      NAUTOBOT_ALLOWED_HOSTS: "*"
      NAUTOBOT_CREATE_SUPERUSER: "true"
      NAUTOBOT_SUPERUSER_NAME: admin
      NAUTOBOT_SUPERUSER_PASSWORD: ${NAUTOBOT_SUPERUSER_PASSWORD}
      NAUTOBOT_SUPERUSER_API_TOKEN: ${NAUTOBOT_TOKEN}
      NAUTOBOT_INSTALLATION_METRICS_ENABLED: "false"
    depends_on:
      nautobot-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - netwatch-net

networks:
  netwatch-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  nautobot_db_data:
    driver: local
